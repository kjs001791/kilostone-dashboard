services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: kilostone-api:latest
    container_name: kilostone-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db
    volumes:
      - ./data:/app/data
    networks:
      - proxy-network
      - kilostone-internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: kilostone-frontend:latest
    container_name: kilostone-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - proxy-network
      - kilostone-internal

  db:
    image: mariadb:10.6
    container_name: kilostone-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - kilostone-internal
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

networks:
  proxy-network:
    driver: bridge
  kilostone-internal:
    driver: bridge
