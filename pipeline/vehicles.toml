# Vehicle list template. The values are empty on purpose: the user fills them in later.
# parse_driving.py reads this file. An entry counts only when vehicle_id is filled; entries left empty are ignored.
# vehicle_id is a number with no meaning (V01, V02, ...). Brand, model and model year are separate columns.
#
# A row is given an id when exactly one entry matches it:
#   name match  the brand found in the sheet title equals brand, or one of title_words appears in the title, or the brand text is in the title
#               (case and spaces ignored)
#   date match  the row date lies in service_start..service_end (a blank bound is open)
# Two cars of one brand (two Scania) are told apart by their service dates, so fill them in for both.
# While this file is empty, parse_driving.py splits a brand into provisional periods (Scania-1, Scania-2) where another car ran in between.
# Copy the [[vehicle]] block once per vehicle. Dates are written as YYYY-MM-DD.

[[vehicle]]
vehicle_id = ""
brand = ""
model = ""
model_year = ""
service_start = ""
service_end = ""
title_words = []
